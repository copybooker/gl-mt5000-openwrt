name: Build GL-MT5000 OpenWrt (DSA)

on:
  workflow_dispatch:

env:
  OPENWRT_PATH: /mnt/openwrt
  TZ: Europe/Lisbon

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget \
            libelf-dev ccache qemu-utils

      - name: Clone OpenWrt (official, openwrt-25.12)
        run: |
          sudo mkdir -p /mnt/openwrt
          sudo chown -R "$USER:$USER" /mnt/openwrt
          git config --global --unset-all url.https://com.insteadof || true
          git config --global --unset-all url.https://github.com || true
          sudo git config --system --unset-all url.https://com.insteadof || true
          sudo git config --system --unset-all url.https://github.com || true
          git clone -c url."https://github.com/".insteadOf="" --depth 1 -b v25.12.0 https://github.com /mnt/openwrt
          cd /mnt/openwrt
          echo "HEAD: $(git rev-parse --short HEAD)"

      - name: Cache downloads & ccache
        uses: actions/cache@v4
        with:
          path: |
            /mnt/openwrt/dl
            /mnt/openwrt/.ccache
          key: mt5000-v25.12.0
          restore-keys: mt5000-

      - name: Update & install feeds (official only)
        run: |
          cd /mnt/openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cd /mnt/openwrt
          cp "$GITHUB_WORKSPACE/config/mt5000.config" .config
          make defconfig

      - name: Verify switch driver is selected
        run: |
          cd /mnt/openwrt
          grep '^CONFIG_PACKAGE_kmod-rtl8366ub' .config || true

      - name: Download sources
        run: |
          cd /mnt/openwrt
          make -j$(nproc) download || make -j1 download

      - name: Compile firmware
        run: |
          cd /mnt/openwrt
          make -j$(nproc) || make -j$(nproc) || make -j1 V=s

      - name: Collect firmware
        if: always()
        run: |
          cd /mnt/openwrt
          mkdir -p "$GITHUB_WORKSPACE/artifact"
          find bin/targets -type f \( -name '*sysupgrade.bin' -o -name '*initramfs*.bin' \
            -o -name '*.manifest' -o -name 'config.buildinfo' \) \
            -exec cp {} "$GITHUB_WORKSPACE/artifact/" \; || true
          cp .config "$GITHUB_WORKSPACE/artifact/resolved.config" || true
          ls -la "$GITHUB_WORKSPACE/artifact/" || true

      - name: Upload firmware artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gl-mt5000-firmware
          path: artifact/
          if-no-files-found: warn
          retention-days: 14
